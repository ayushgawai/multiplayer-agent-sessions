services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: mas
      POSTGRES_PASSWORD: mas
      POSTGRES_DB: mas
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  jaeger:
    image: jaegertracing/all-in-one:1.60
    ports:
      - "16686:16686"
      - "4317:4317"

  session-service:
    build:
      context: ..
      dockerfile: infra/Dockerfile.session-service
    environment:
      DATABASE_URL: postgresql+psycopg://mas:mas@postgres:5432/mas
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis

  serving:
    build:
      context: ..
      dockerfile: infra/Dockerfile.serving
    ports:
      - "8001:8001"
    depends_on:
      - session-service

volumes:
  pgdata:
