name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt
      - name: Ruff
        run: ruff check session-service serving models
      - name: Mypy
        run: mypy --ignore-missing-imports session-service/app serving
      - name: Pytest
        working-directory: session-service
        run: pytest -q
