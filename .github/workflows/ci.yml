name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt
      - name: Ruff
        run: ruff check session-service serving models eval
      - name: Mypy
        run: |
          mypy --ignore-missing-imports session-service/app
          mypy --ignore-missing-imports serving
          mypy eval
      - name: Pytest session-service
        working-directory: session-service
        run: pytest -q
      - name: Pytest serving
        working-directory: serving
        run: pytest -q
      - name: Pytest data
        run: pytest -q data/tests
      - name: Pytest eval
        run: pytest -q eval/tests
      - name: Pytest MAST baseline
        run: pytest -q models/baseline_mast/tests
      - name: Checkpointing self-check
        run: PYTHONPATH=. python models/common/check_checkpointing.py
