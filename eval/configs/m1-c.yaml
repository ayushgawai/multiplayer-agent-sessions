contract: eval/configs/m1-contract.yaml
task: m1_catchup
candidate_id: m1-c
label: "Phi-4-mini-instruct + QLoRA"
mode: qlora
trainer: causal_lm_qlora
model:
  repo: microsoft/Phi-4-mini-instruct
  revision: "cfbefacb99257ffa30c83adab238a50856ac3083"
split: data/splits/m1_v1/
evaluation_split: data/splits/m1_session_v1/
schemas:
  input: m1-input-v1
  output: m1-output-v1
seeds: [13, 29, 47]
train:
  epochs: 3
  max_seq_len: 4096
  effective_batch_size: 16
  lr: 2.0e-4
  warmup_ratio: 0.06
  save_steps: 200
  checkpoint_uri: "file://./checkpoints/m1-c/"
lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: [qkv_proj, o_proj, gate_up_proj, down_proj]
prompt_file: null
metrics: [schema_valid_rate, critical_fact_recall, unsupported_claim_rate, attribution_accuracy, status_consistency, rouge_l, bertscore_f1, human_edit_rate, latency_p50_ms, latency_p95_ms, peak_vram_mb]
primary_metric: critical_fact_recall
ablation:
  context_tokens: [512, 1024, 2048]
  approved_memory: [false, true]
failure_codes: [invalid_schema, missing_critical_fact, unsupported_claim, wrong_attribution, wrong_status, generic_output, truncated]
